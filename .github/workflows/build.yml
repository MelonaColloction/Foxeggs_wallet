name: Build FoxEggs Wallet Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # NODE.JS
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ==========================================
      # JAVA
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ==========================================
      # ANDROID SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      # ==========================================
      # INSTALL REQUIRED ANDROID PACKAGES
      # ==========================================
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          echo "✅ Android SDK packages installed."

      # ==========================================
      # PREPARE WALLET
      # ==========================================
      - name: Prepare wallet
        run: |
          test -f index.html
          rm -rf www
          mkdir -p www
          cp index.html www/index.html
          echo "✅ Wallet prepared."

      # ==========================================
      # CREATE PACKAGE.JSON
      # ==========================================
      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "foxeggs-wallet",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^7.4.0",
              "@capacitor/android": "^7.4.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.0"
            }
          }
          EOF

      # ==========================================
      # INSTALL DEPENDENCIES
      # ==========================================
      - name: Install dependencies
        run: npm install

      # ==========================================
      # CREATE CAPACITOR CONFIG
      # ==========================================
      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.foxeggs.wallet",
            "appName": "FoxEggs Wallet",
            "webDir": "www",
            "android": {
              "allowMixedContent": true,
              "webContentsDebuggingEnabled": false
            }
          }
          EOF

      # ==========================================
      # ADD ANDROID
      # ==========================================
      - name: Add Android
        run: npx cap add android

      # ==========================================
      # SYNC ANDROID
      # ==========================================
      - name: Sync Android
        run: npx cap sync android

      # ==========================================
      # VERSION
      # ==========================================
      - name: Set version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION_CODE=$((RUN_NUMBER + 100))
          VERSION_NAME="1.0.${RUN_NUMBER}"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "Version Code: $VERSION_CODE"
          echo "Version Name: $VERSION_NAME"

      # ==========================================
      # LOAD KEYSTORE (بدون شرط if)
      # ==========================================
      - name: Load existing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "⚠️  KEYSTORE_BASE64 not found - building UNSIGNED."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > FoxEggs.keystore
          test -s FoxEggs.keystore
          mkdir -p android/app
          cp FoxEggs.keystore android/app/FoxEggs.keystore
          echo "✅ Keystore loaded."

      # ==========================================
      # CONFIGURE SIGNING PROPERTIES (بدون شرط if)
      # ==========================================
      - name: Configure signing properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ ! -f android/app/FoxEggs.keystore ]; then
            echo "⚠️  No keystore - skipping signing config."
            exit 0
          fi
          cat >> android/gradle.properties <<EOF

          FOXEGGS_KEYSTORE_FILE=FoxEggs.keystore
          FOXEGGS_KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}
          FOXEGGS_KEY_ALIAS=foxeggs
          FOXEGGS_KEY_PASSWORD=${KEYSTORE_PASSWORD}
          EOF
          echo "✅ Signing properties configured."

      # ==========================================
      # CONFIGURE ANDROID GRADLE
      # ==========================================
      - name: Configure Android Gradle
        run: |
          python3 - <<'PY'
          import re
          import os

          path = "android/app/build.gradle"
          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          text = re.sub(r'applicationId\s+"[^"]+"', 'applicationId "com.foxeggs.wallet"', text, count=1)
          text = re.sub(r'compileSdk\s+\d+', 'compileSdk 35', text, count=1)
          text = re.sub(r'versionCode\s+\d+', 'versionCode ' + os.environ["VERSION_CODE"], text, count=1)
          text = re.sub(r'versionName\s+"[^"]+"', 'versionName "' + os.environ["VERSION_NAME"] + '"', text, count=1)

          text = re.sub(
              r'\n\s*signingConfigs\s*\{.*?\n\s*\}\s*(?=\n\s*buildTypes)',
              '', text, count=1, flags=re.S
          )

          if os.path.exists("android/app/FoxEggs.keystore"):
              signing_block = '''
              signingConfigs {
                  release {
                      storeFile file(FOXEGGS_KEYSTORE_FILE)
                      storePassword FOXEGGS_KEYSTORE_PASSWORD
                      keyAlias FOXEGGS_KEY_ALIAS
                      keyPassword FOXEGGS_KEY_PASSWORD
                      v1SigningEnabled true
                      v2SigningEnabled true
                  }
              }

              '''
              if "signingConfigs {" not in text:
                  text = text.replace("    buildTypes {", signing_block + "    buildTypes {", 1)

              release_pattern = r'(buildTypes\s*\{\s*release\s*\{)'
              if "signingConfig signingConfigs.release" not in text:
                  text = re.sub(
                      release_pattern,
                      r'\1\n            signingConfig signingConfigs.release',
                      text, count=1, flags=re.S
                  )

          if re.search(r'buildTypes\s*\{.*?release\s*\{', text, re.S):
              release_match = re.search(
                  r'(buildTypes\s*\{\s*release\s*\{)(.*?)(\n\s*\})',
                  text, re.S
              )
              if release_match:
                  release_body = release_match.group(2)
                  if "minifyEnabled" in release_body:
                      release_body = re.sub(r'minifyEnabled\s+\w+', 'minifyEnabled false', release_body, count=1)
                  else:
                      release_body = "\n            minifyEnabled false" + release_body
                  text = text[:release_match.start(2)] + release_body + text[release_match.end(2):]

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("✅ Gradle configured.")
          PY

      # ==========================================
      # CLEAN PERMISSIONS
      # ==========================================
      - name: Clean unnecessary permissions
        run: |
          python3 - <<'PY'
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          permissions = [
              "READ_CONTACTS", "WRITE_CONTACTS", "READ_SMS", "SEND_SMS",
              "RECEIVE_SMS", "CALL_PHONE", "READ_PHONE_STATE",
              "ACCESS_FINE_LOCATION", "ACCESS_COARSE_LOCATION",
              "CAMERA", "RECORD_AUDIO",
              "READ_EXTERNAL_STORAGE", "WRITE_EXTERNAL_STORAGE",
              "MANAGE_EXTERNAL_STORAGE", "REQUEST_INSTALL_PACKAGES",
              "SYSTEM_ALERT_WINDOW", "BIND_ACCESSIBILITY_SERVICE"
          ]

          for permission in permissions:
              pattern = r'\s*<uses-permission\s+android:name="android\.permission\.' + permission + r'"\s*/>'
              text = re.sub(pattern, '', text)

          # اطمینان از وجود INTERNET برای اتصال به RPC
          if 'android.permission.INTERNET' not in text:
              text = text.replace(
                  '<application',
                  '<uses-permission android:name="android.permission.INTERNET" />\n    <application',
                  1
              )

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("✅ Permissions cleaned.")
          PY

      # ==========================================
      # INSTALL PILLOW
      # ==========================================
      - name: Install Pillow
        run: python3 -m pip install pillow

      # ==========================================
      # FIND CUSTOM WALLET ICON
      # ==========================================
      - name: Find custom wallet icon
        run: |
          python3 - <<'PY'
          import os
          extensions = (".png", ".jpg", ".jpeg", ".webp")
          files = [f for f in os.listdir(".")
                   if os.path.isfile(f) and f.lower().endswith(extensions)]
          ignored = {"foxeggs-icon.png", "wallet-logo.png"}
          files = [f for f in files if f.lower() not in ignored]

          if not files:
              raise SystemExit("❌ No image found in project root.")

          preferred = [f for f in files if f.lower() == "icon.png"]
          logo = preferred[0] if preferred else files[0]
          print("Using image:", logo)
          with open("CUSTOM_ICON", "w") as f:
              f.write(logo)
          PY

      # ==========================================
      # GENERATE ANDROID ICONS
      # ==========================================
      - name: Generate Android icons
        run: |
          python3 - <<'PY'
          from PIL import Image
          import os

          with open("CUSTOM_ICON", "r") as f:
              filename = f.read().strip()

          source = Image.open(filename).convert("RGBA")
          sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}

          for density, size in sizes.items():
              folder = "android/app/src/main/res/mipmap-" + density
              os.makedirs(folder, exist_ok=True)
              icon = source.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(folder + "/ic_launcher.png")
              icon.save(folder + "/ic_launcher_round.png")

          print("✅ Icons generated.")
          PY

      # ==========================================
      # REMOVE ADAPTIVE ICONS
      # ==========================================
      - name: Remove adaptive icon defaults
        run: |
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      # ==========================================
      # BUILD RELEASE APK
      # ==========================================
      - name: Build Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleRelease --no-daemon

      # ==========================================
      # BUILD RELEASE AAB
      # ==========================================
      - name: Build Release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      # ==========================================
      # PREPARE RELEASE
      # ==========================================
      - name: Prepare release
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/FoxEggs-Wallet.apk
          cp android/app/build/outputs/bundle/release/app-release.aab release/FoxEggs-Wallet.aab
          CUSTOM_ICON=$(cat CUSTOM_ICON)
          cp "$CUSTOM_ICON" release/FoxEggs-Wallet-Icon.png
          echo "✅ Release files ready."

      # ==========================================
      # UPLOAD ARTIFACT
      # ==========================================
      - name: Upload FoxEggs Wallet Release
        uses: actions/upload-artifact@v4
        with:
          name: FoxEggs-Wallet-Release-${{ github.run_number }}
          path: release/
          if-no-files-found: error
          retention-days: 30

      # ==========================================
      # CLEANUP
      # ==========================================
      - name: Cleanup
        if: always()
        run: |
          rm -f FoxEggs.keystore
          rm -f android/app/FoxEggs.keystore
          echo "🧹 Cleanup done."
