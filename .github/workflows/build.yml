name: Build FoxEggs Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================
      # Checkout
      # =========================================

      - name: Checkout
        uses: actions/checkout@v5


      # =========================================
      # Node.js
      # =========================================

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20


      # =========================================
      # Java
      # =========================================

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21


      # =========================================
      # Android SDK
      # =========================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # =========================================
      # Prepare Web Files
      # =========================================

      - name: Prepare web files
        run: |
          test -f index.html
          rm -rf www
          mkdir -p www
          cp index.html www/
          cp -r assets www/ 2>/dev/null || true


      # =========================================
      # Create package.json
      # =========================================

      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "foxeggs-wallet",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^6.0.0",
              "@capacitor/android": "^6.0.0",
              "@capacitor/splash-screen": "^6.0.0",
              "@capacitor/app": "^6.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.0.0"
            }
          }
          EOF


      # =========================================
      # Install Capacitor
      # =========================================

      - name: Install dependencies
        run: |
          npm install


      # =========================================
      # Capacitor configuration
      # =========================================

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.foxeggs.wallet",
            "appName": "FoxEggs Wallet",
            "webDir": "www",
            "bundledWebRuntime": false,
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 1500,
                "backgroundColor": "#0b0e1a",
                "androidSplashResourceName": "splash",
                "androidScaleType": "CENTER_CROP"
              }
            }
          }
          EOF


      # =========================================
      # Add Android
      # =========================================

      - name: Add Android
        run: |
          npx cap add android


      - name: Sync Android
        run: |
          npx cap sync android


      # =========================================
      # Version
      # =========================================

      - name: Set version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION_CODE=$((RUN_NUMBER + 100))
          VERSION_NAME="1.0.${RUN_NUMBER}"

          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

          echo "Version Code: $VERSION_CODE"
          echo "Version Name: $VERSION_NAME"


      # =========================================
      # Install Pillow
      # =========================================

      - name: Install Pillow
        run: |
          python3 -m pip install pillow


      # =========================================
      # Create FoxEggs Logo
      # =========================================

      - name: Create FoxEggs icon
        run: |

          cat > create_fox_icon.py <<'PY'

          from PIL import Image, ImageDraw, ImageFont, ImageFilter
          import math

          S = 1024

          # -----------------------------------------
          # بوم با پس‌زمینه گرادیانت
          # -----------------------------------------

          img = Image.new("RGBA", (S, S), (11, 14, 26, 255))
          d = ImageDraw.Draw(img)

          # -----------------------------------------
          # حلقه‌های نورانی پیشرفته
          # -----------------------------------------

          colors = [(233, 69, 96), (255, 100, 150), (180, 50, 255)]
          for i, r in enumerate(range(420, 280, -30)):
              alpha = int(30 * (1 - (r - 280) / 140))
              color = colors[i % len(colors)]
              d.ellipse(
                  (S//2 - r, S//2 - r, S//2 + r, S//2 + r),
                  outline=(color[0], color[1], color[2], alpha),
                  width=3
              )

          # -----------------------------------------
          # دایره اصلی با افکت شیشه‌ای
          # -----------------------------------------

          d.ellipse(
              (S//2 - 380, S//2 - 380, S//2 + 380, S//2 + 380),
              fill=(20, 22, 45, 240),
              outline=(233, 69, 96, 180),
              width=8
          )

          # -----------------------------------------
          # هاله نورانی پشت روباه
          # -----------------------------------------

          for r in range(200, 100, -10):
              alpha = int(15 * (1 - (r - 100) / 100))
              d.ellipse(
                  (S//2 - r, S//2 - r + 30, S//2 + r, S//2 + r + 30),
                  outline=(255, 200, 100, alpha),
                  width=2
              )

          # -----------------------------------------
          # صورت روباه - طراحی مدرن‌تر
          # -----------------------------------------

          # گوش‌های بزرگ و تیز
          fox_dark = (180, 60, 20, 255)
          fox_light = (255, 160, 50, 255)

          # گوش چپ
          d.polygon([
              (S//2 - 180, 360),
              (S//2 - 300, 200),
              (S//2 - 100, 300)
          ], fill=fox_dark)

          # گوش راست
          d.polygon([
              (S//2 + 180, 360),
              (S//2 + 300, 200),
              (S//2 + 100, 300)
          ], fill=fox_dark)

          # گوش داخلی (نارنجی روشن)
          d.polygon([
              (S//2 - 165, 350),
              (S//2 - 260, 230),
              (S//2 - 120, 310)
          ], fill=fox_light)

          d.polygon([
              (S//2 + 165, 350),
              (S//2 + 260, 230),
              (S//2 + 120, 310)
          ], fill=fox_light)

          # صورت اصلی (نارنجی)
          fox_main = (255, 140, 40, 255)
          points = [
              (S//2, 290),
              (S//2 - 240, 480),
              (S//2 - 260, 600),
              (S//2 - 180, 660),
              (S//2, 680),
              (S//2 + 180, 660),
              (S//2 + 260, 600),
              (S//2 + 240, 480),
          ]
          d.polygon(points, fill=fox_main)

          # -----------------------------------------
          # صورت سفید با طراحی زیباتر
          # -----------------------------------------

          white_face = [
              (S//2, 400),
              (S//2 - 150, 480),
              (S//2 - 180, 560),
              (S//2 - 100, 640),
              (S//2, 660),
              (S//2 + 100, 640),
              (S//2 + 180, 560),
              (S//2 + 150, 480),
          ]
          d.polygon(white_face, fill=(255, 255, 255, 235))

          # -----------------------------------------
          # چشم‌های جذاب و درخشان
          # -----------------------------------------

          # چشم چپ
          d.ellipse(
              (S//2 - 120, 440, S//2 - 60, 490),
              fill=(10, 10, 20, 255)
          )
          # مردمک
          d.ellipse(
              (S//2 - 100, 450, S//2 - 80, 470),
              fill=(233, 69, 96, 200)
          )
          # هایلایت
          d.ellipse(
              (S//2 - 110, 445, S//2 - 95, 460),
              fill=(255, 255, 255, 220)
          )
          d.ellipse(
              (S//2 - 85, 460, S//2 - 75, 470),
              fill=(255, 255, 255, 150)
          )

          # چشم راست
          d.ellipse(
              (S//2 + 60, 440, S//2 + 120, 490),
              fill=(10, 10, 20, 255)
          )
          d.ellipse(
              (S//2 + 80, 450, S//2 + 100, 470),
              fill=(233, 69, 96, 200)
          )
          d.ellipse(
              (S//2 + 70, 445, S//2 + 85, 460),
              fill=(255, 255, 255, 220)
          )
          d.ellipse(
              (S//2 + 95, 460, S//2 + 105, 470),
              fill=(255, 255, 255, 150)
          )

          # -----------------------------------------
          # ابروهای زیبا
          # -----------------------------------------

          d.arc(
              (S//2 - 140, 425, S//2 - 40, 465),
              start=180,
              end=360,
              fill=(40, 30, 20, 200),
              width=6
          )
          d.arc(
              (S//2 + 40, 425, S//2 + 140, 465),
              start=180,
              end=360,
              fill=(40, 30, 20, 200),
              width=6
          )

          # -----------------------------------------
          # بینی (قلبی شکل)
          # -----------------------------------------

          # بینی اصلی
          d.ellipse(
              (S//2 - 25, 495, S//2 + 25, 530),
              fill=(30, 20, 30, 255)
          )
          # براقی بینی
          d.ellipse(
              (S//2 - 10, 500, S//2 + 10, 515),
              fill=(60, 40, 50, 180)
          )

          # -----------------------------------------
          # دهان با لبخند زیبا
          # -----------------------------------------

          d.arc(
              (S//2 - 60, 520, S//2 + 60, 570),
              start=0,
              end=180,
              fill=(30, 20, 30, 200),
              width=7
          )

          # خطوط لبخند
          d.arc(
              (S//2 - 80, 525, S//2 - 20, 580),
              start=0,
              end=90,
              fill=(30, 20, 30, 150),
              width=5
          )
          d.arc(
              (S//2 + 20, 525, S//2 + 80, 580),
              start=90,
              end=180,
              fill=(30, 20, 30, 150),
              width=5
          )

          # -----------------------------------------
          # ستاره‌های تزئینی دور لوگو
          # -----------------------------------------

          star_points = [
              (0.15, 0.15), (0.85, 0.15),
              (0.15, 0.85), (0.85, 0.85),
              (0.5, 0.05), (0.5, 0.95),
              (0.05, 0.5), (0.95, 0.5)
          ]

          for x, y in star_points:
              px, py = int(x * S), int(y * S)
              size = 12
              # ستاره ۴ پر
              d.polygon([
                  (px, py - size),
                  (px + size//3, py - size//3),
                  (px + size, py),
                  (px + size//3, py + size//3),
                  (px, py + size),
                  (px - size//3, py + size//3),
                  (px - size, py),
                  (px - size//3, py - size//3),
              ], fill=(233, 69, 96, 60))

          # -----------------------------------------
          # تخم‌مرغ طلایی پشت لوگو
          # -----------------------------------------

          # تخم‌مرغ درخشان
          d.ellipse(
              (S//2 - 70, S//2 - 90, S//2 + 70, S//2 + 90),
              outline=(255, 215, 0, 100),
              width=4
          )
          d.ellipse(
              (S//2 - 50, S//2 - 70, S//2 + 50, S//2 + 70),
              outline=(255, 215, 0, 40),
              width=2
          )

          # -----------------------------------------
          # متن اصلی با افکت سایه
          # -----------------------------------------

          try:
              font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 85)
          except:
              font = ImageFont.load_default()

          # سایه
          for offset in range(3, 0, -1):
              d.text(
                  (S//2 + offset, 740 + offset),
                  "FoxEggs",
                  font=font,
                  fill=(0, 0, 0, 60 - offset * 15),
                  anchor="mm"
              )

          # متن اصلی با گرادیانت (با دو لایه)
          d.text(
              (S//2, 738),
              "FoxEggs",
              font=font,
              fill=(255, 100, 150, 255),
              anchor="mm"
          )
          d.text(
              (S//2, 735),
              "FoxEggs",
              font=font,
              fill=(233, 69, 96, 255),
              anchor="mm"
          )

          # -----------------------------------------
          # زیرنویس حرفه‌ای
          # -----------------------------------------

          try:
              font_small = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf", 38)
          except:
              font_small = ImageFont.load_default()

          # زیرنویس با افکت
          d.text(
              (S//2 + 2, 800),
              "Avalanche Wallet",
              font=font_small,
              fill=(0, 0, 0, 100),
              anchor="mm"
          )
          d.text(
              (S//2, 798),
              "Avalanche Wallet",
              font=font_small,
              fill=(180, 180, 220, 220),
              anchor="mm"
          )

          # -----------------------------------------
          # خط تزئینی زیر متن
          # -----------------------------------------

          d.line(
              (S//2 - 200, 820, S//2 + 200, 820),
              fill=(233, 69, 96, 120),
              width=3
          )
          d.line(
              (S//2 - 180, 828, S//2 + 180, 828),
              fill=(233, 69, 96, 60),
              width=2
          )

          # -----------------------------------------
          # ذرات نورانی (Sparkles)
          # -----------------------------------------

          sparkle_positions = [
              (120, 200), (900, 180), (150, 700), (880, 720),
              (200, 500), (820, 500), (500, 100), (500, 780)
          ]

          for x, y in sparkle_positions:
              size = 6
              for i in range(4):
                  angle = i * 90 + 45
                  rad = math.radians(angle)
                  dx = int(size * math.cos(rad))
                  dy = int(size * math.sin(rad))
                  d.line(
                      (x - dx, y - dy, x + dx, y + dy),
                      fill=(255, 255, 255, 80),
                      width=2
                  )

          # -----------------------------------------
          # Save
          # -----------------------------------------

          img.save("foxeggs-icon.png", "PNG")
          print("✅ FoxEggs icon created successfully!")

          PY

          python3 create_fox_icon.py
          test -s foxeggs-icon.png


      # =========================================
      # Generate Android icon sizes
      # =========================================

      - name: Generate Android icons
        run: |

          python3 - <<'PY'

          from PIL import Image
          import os

          source = Image.open("foxeggs-icon.png").convert("RGBA")

          sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}

          for density, size in sizes.items():
              folder = "android/app/src/main/res/mipmap-" + density
              os.makedirs(folder, exist_ok=True)
              icon = source.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(folder + "/ic_launcher.png")
              icon.save(folder + "/ic_launcher_round.png")

          print("Android icons generated successfully.")

          PY


      # =========================================
      # Remove adaptive icon defaults
      # =========================================

      - name: Remove adaptive icon defaults
        run: |
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml


      # =========================================
      # Configure App Icon and Name
      # =========================================

      - name: Configure App Icon
        run: |

          python3 - <<'PY'

          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")

          if "android:icon=" in text:
              text = re.sub(r'android:icon="[^"]+"', 'android:icon="@mipmap/ic_launcher"', text)
          if "android:roundIcon=" in text:
              text = re.sub(r'android:roundIcon="[^"]+"', 'android:roundIcon="@mipmap/ic_launcher_round"', text)
          manifest.write_text(text, encoding="utf-8")

          strings = Path("android/app/src/main/res/values/strings.xml")
          if strings.exists():
              text = strings.read_text(encoding="utf-8")
              text = re.sub(r'<string name="app_name">.*?</string>', '<string name="app_name">FoxEggs</string>', text)
              strings.write_text(text, encoding="utf-8")

          print("Icon and app name configured.")

          PY


      # =========================================
      # Generate Keystore (self-signed)
      # =========================================

      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore foxeggs.keystore \
            -alias foxeggs \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass foxeggs123 \
            -keypass foxeggs123 \
            -dname "CN=FoxEggs Wallet, OU=Development, O=FoxEggs, L=Unknown, ST=Unknown, C=XX"
          cp foxeggs.keystore android/app/foxeggs.keystore
          echo "Keystore generated successfully."


      # =========================================
      # Configure signing properties
      # =========================================

      - name: Configure signing properties
        run: |
          cat >> android/gradle.properties <<EOF

          FOXEGGS_KEYSTORE_FILE=foxeggs.keystore
          FOXEGGS_KEYSTORE_PASSWORD=foxeggs123
          FOXEGGS_KEY_ALIAS=foxeggs
          FOXEGGS_KEY_PASSWORD=foxeggs123
          EOF


      # =========================================
      # Configure Android Gradle
      # =========================================

      - name: Configure Android Gradle
        run: |

          python3 - <<'PY'

          import re
          import os

          path = "android/app/build.gradle"

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          text = re.sub(r'applicationId\s+"[^"]+"', 'applicationId "com.foxeggs.wallet"', text, count=1)
          text = re.sub(r'compileSdk\s+[^\n]+', 'compileSdk 35', text, count=1)
          text = re.sub(r'versionCode\s+\d+', 'versionCode ' + os.environ["VERSION_CODE"], text, count=1)
          text = re.sub(r'versionName\s+"[^"]+"', 'versionName "' + os.environ["VERSION_NAME"] + '"', text, count=1)

          text = re.sub(r'\n\s*signingConfigs\s*\{.*?\n\s*\}\s*(?=\n\s*buildTypes)', '', text, flags=re.S)

          signing_block = '''
              signingConfigs {
                  release {
                      storeFile file(FOXEGGS_KEYSTORE_FILE)
                      storePassword FOXEGGS_KEYSTORE_PASSWORD
                      keyAlias FOXEGGS_KEY_ALIAS
                      keyPassword FOXEGGS_KEY_PASSWORD
                      v1SigningEnabled true
                      v2SigningEnabled true
                  }
              }

          '''

          if "signingConfigs {" not in text:
              text = text.replace("    buildTypes {", signing_block + "    buildTypes {", 1)

          pattern = r'(buildTypes\s*\{\s*release\s*\{)'
          replacement = r'\1\n            signingConfig signingConfigs.release'

          if "signingConfig signingConfigs.release" not in text:
              text = re.sub(pattern, replacement, text, count=1, flags=re.S)

          text = re.sub(r'minifyEnabled\s+\w+', 'minifyEnabled false', text, count=1)

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("Android Gradle configured successfully.")

          PY


      # =========================================
      # Build Release APK
      # =========================================

      - name: Build Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleRelease --no-daemon


      # =========================================
      # Verify APK
      # =========================================

      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          echo "=========================================="
          echo "APK CREATED"
          echo "=========================================="
          ls -lh "$APK"
          echo ""
          echo "SHA256:"
          sha256sum "$APK"


      # =========================================
      # Build AAB
      # =========================================

      - name: Build Release AAB
        working-directory: android
        run: |
          ./gradlew bundleRelease --no-daemon


      # =========================================
      # Prepare release files
      # =========================================

      - name: Prepare release
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/FoxEggs-Wallet.apk
          cp android/app/build/outputs/bundle/release/app-release.aab release/FoxEggs-Wallet.aab
          cp foxeggs-icon.png release/icon.png


      # =========================================
      # Upload APK + AAB + Icon (Artifact)
      # =========================================

      - name: Upload FoxEggs Artifact
        uses: actions/upload-artifact@v6
        with:
          name: FoxEggs-Android-Release
          path: release/
          if-no-files-found: error


      # =========================================
      # 🎯 Create GitHub Release (برای دانلود راحت)
      # =========================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "🦊 FoxEggs Wallet v1.0.${{ github.run_number }}"
          body: |
            ## 🎉 نسخه جدید FoxEggs Wallet
            
            ### 📱 فایل‌های قابل دانلود:
            - **FoxEggs-Wallet.apk** - فایل نصب مستقیم روی اندروید
            - **FoxEggs-Wallet.aab** - فایل آپلود در گوگل پلی
            - **icon.png** - آیکون برنامه
            
            ### ✅ تغییرات:
            - نسخه: `1.0.${{ github.run_number }}`
            
            ### 📥 نحوه نصب:
            1. فایل APK رو دانلود کن
            2. روی گوشی نصب کن (قبلاً نصب از منابع ناشناس رو فعال کن)
            
            🦊 لذت ببرید!
          draft: false
          prerelease: false
          files: |
            release/FoxEggs-Wallet.apk
            release/FoxEggs-Wallet.aab
            release/icon.png
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
