name: Build FoxEggs Wallet Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'price.js'
      - 'icon.png'
      - 'notification.png'
      - 'Fox123.png'
      - 'image/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v5

      # ==========================================
      # NODE.JS
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # ==========================================
      # JAVA
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # ==========================================
      # ANDROID SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      # ==========================================
      # INSTALL ANDROID PACKAGES
      # ==========================================
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          echo "Android SDK packages installed."

      # ==========================================
      # PREPARE WALLET
      # ==========================================
      - name: Prepare wallet
        run: |
          test -f index.html
          rm -rf www
          mkdir -p www
          cp index.html www/index.html
          
          if [ -f price.js ]; then
            cp price.js www/price.js
            echo "✅ price.js copied to www/"
          else
            cat > www/price.js <<'EOF'
          window.NFT_PRICES = { currency: 'USDT', lastUpdate: 'unknown', collections: {}, overridePrices: {} };
          EOF
          fi

          if [ -f Fox123.png ]; then cp Fox123.png www/Fox123.png; fi
          if [ -f notification.png ]; then cp notification.png www/notification.png; fi
          if [ -d image ]; then cp -r image www/image; fi
          
          echo "Wallet prepared."

      # ==========================================
      # 1. INJECT WALLET RECOVERY (نجات اطلاعات والت)
      # ==========================================
      - name: Inject Wallet Recovery
        run: |
          python3 - <<'PY'
          import re
          with open("www/index.html", "r", encoding="utf-8") as f:
              html = f.read()

          # اسکریپت نجات که قبل از هر چیز اجرا میشه
          recovery_script = '''
          <script>
          // ===== FOXEGGS WALLET AUTO-RECOVERY =====
          (function() {
              var walletKeys = ['wallet', 'wallet_data', 'my_wallet', 'local_wallet', 'user_wallet', 'walletList', 'walletAddress', 'foxWallet', 'fox_wallet', 'foxeggs_wallet', 'foxeggsWallet', 'foxBest', 'foxGames', 'foxEggs', 'foxTotalScore', 'foxUserId'];
              
              try {
                  var hasWallet = false;
                  for (var i = 0; i < walletKeys.length; i++) {
                      if (localStorage.getItem(walletKeys[i])) {
                          hasWallet = true;
                          break;
                      }
                  }

                  if (!hasWallet) {
                      for (var i = 0; i < walletKeys.length; i++) {
                          var backup = sessionStorage.getItem(walletKeys[i]);
                          if (backup) {
                              localStorage.setItem(walletKeys[i], backup);
                              console.log("✅ Wallet Recovered from SessionStorage:", walletKeys[i]);
                              hasWallet = true;
                          }
                      }
                  }
              } catch(e) {
                  console.error("Recovery failed:", e);
              }
          })();
          </script>
          '''

          if '<head>' in html:
              html = html.replace('<head>', '<head>\n' + recovery_script, 1)
          else:
              html = recovery_script + html

          with open("www/index.html", "w", encoding="utf-8") as f:
              f.write(html)
          print("✅ Wallet Recovery Script Injected.")
          PY

      # ==========================================
      # 2. OBFUSCATE & MINIFY CODE (با حفظ اطلاعات والت)
      # ==========================================
      - name: Obfuscate and Minify
        run: |
          echo "🔒 Installing obfuscator..."
          npm install -g javascript-obfuscator
          npm install -g html-minifier-terser

          python3 - <<'PY'
          import re
          import os
          import subprocess

          OBFUSCATOR = "javascript-obfuscator"

          # ============================================================
          # لیست کلمات کلیدی (کلیدهای localStorage و آبجکت‌ها)
          # این کلمات هرگز مبهم نمی‌شوند تا اطلاعات قبلی پیدا شوند
          # ============================================================
          RESERVED_WORDS = ",".join([
              # کلیدهای مربوط به والت
              "wallet", "wallet_data", "wallets", "walletList", "my_wallet", 
              "local_wallet", "user_wallet", "walletAddress", "wallet_address", 
              "walletSeed", "privateKey", "private_key", "mnemonic", "seedPhrase", 
              "seed_phrase", "balance", "transactions", "foxWallet", "fox_wallet",
              "foxeggs_wallet", "foxeggsWallet",
              # کلیدهای مربوط به بازی و رکوردها
              "score", "best", "games", "eggs", "totalScore", "language", 
              "sound", "theme", "foxUserId", "foxRegistered", "foxReferralCode",
              "foxBest", "foxGames", "foxEggs", "foxTotalScore",
              # نام آبجکت‌های مهم سیستم
              "NFT_PRICES", "window", "localStorage", "sessionStorage", "JSON"
          ])

          # ============================================================
          # فلگ‌های ابفوسکیتور (قوی، اما با احترام به کلمات رزرو شده)
          # ============================================================
          OBFUSCATOR_FLAGS = [
              "--compact", "true",
              "--control-flow-flattening", "true",
              "--identifier-names-generator", "hexadecimal",
              "--string-array", "true",
              "--string-array-encoding", "base64",
              "--string-array-threshold", "0.75",
              "--split-strings", "true",
              "--self-defending", "true",
              "--debug-protection", "true",
              "--dead-code-injection", "true",
              "--numbers-to-expressions", "true",
              "--unicode-escape-sequence", "true",
              # 👇 دستور طلایی: این کلمات رو دست نزن! 👇
              "--reserved-strings", RESERVED_WORDS,
          ]

          def obfuscate_js_content(content, label):
              if len(content.strip()) < 100:
                  return content

              with open("__tmp_in.js", "w", encoding="utf-8") as f:
                  f.write(content)

              result = subprocess.run(
                  [OBFUSCATOR, "__tmp_in.js", "--output", "__tmp_out.js"] + OBFUSCATOR_FLAGS,
                  capture_output=True, text=True
              )

              out_content = None
              if result.returncode == 0 and os.path.exists("__tmp_out.js"):
                  with open("__tmp_out.js", "r", encoding="utf-8") as f:
                      out_content = f.read()
              else:
                  print(f"[WARN] Obfuscation FAILED for {label}")
                  print(f"       stderr: {result.stderr[:300]}")

              for p in ("__tmp_in.js", "__tmp_out.js"):
                  if os.path.exists(p):
                      os.remove(p)

              return out_content if out_content else content

          # پردازش HTML
          with open("www/index.html", "r", encoding="utf-8") as f:
              html = f.read()

          def obfuscate_inline_script(match):
              js = match.group(1)
              return "<script>\n" + obfuscate_js_content(js, "inline") + "\n</script>"

          html = re.sub(
              r'<script(?:\s+[^>]*)?>(.*?)</script>',
              obfuscate_inline_script,
              html,
              flags=re.DOTALL
          )

          with open("www/index.html", "w", encoding="utf-8") as f:
              f.write(html)

          # Minify HTML
          subprocess.run([
              "html-minifier-terser",
              "--collapse-whitespace",
              "--remove-comments",
              "--minify-css", "true",
              "--minify-js", "false",
              "--remove-attribute-quotes",
              "www/index.html",
              "-o", "www/index.html.min"
          ], capture_output=True)

          if os.path.exists("www/index.html.min"):
              os.replace("www/index.html.min", "www/index.html")

          print("✅ Obfuscation and Minify complete.")
          PY

      # ==========================================
      # CREATE PACKAGE.JSON
      # ==========================================
      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "foxeggs-wallet",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^7.4.0",
              "@capacitor/android": "^7.4.0",
              "@capacitor/local-notifications": "^7.0.0",
              "@capgo/capacitor-native-biometric": "^7.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.0"
            }
          }
          EOF

      # ==========================================
      # INSTALL DEPENDENCIES
      # ==========================================
      - name: Install dependencies
        run: npm install

      # ==========================================
      # CREATE CAPACITOR CONFIG (با حفظ پکیج قبلی)
      # ==========================================
      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.foxeggs.wallet",
            "appName": "FoxEggs Wallet",
            "webDir": "www"
          }
          EOF

      # ==========================================
      # ADD ANDROID
      # ==========================================
      - name: Add Android
        run: npx cap add android

      # ==========================================
      # ENABLE IMMERSIVE FULLSCREEN
      # ==========================================
      - name: Enable Fullscreen
        run: |
          python3 - <<'PY'
          import os
          import re

          base = "android/app/src/main/java"
          main_activity = None

          for root, dirs, files in os.walk(base):
              if "MainActivity.java" in files:
                  main_activity = os.path.join(root, "MainActivity.java")
                  break

          if not main_activity:
              raise SystemExit("MainActivity.java not found.")

          with open(main_activity, "r", encoding="utf-8") as f:
              original = f.read()

          package_match = re.search(r'^\s*package\s+([^;]+);', original, re.MULTILINE)
          package_name = package_match.group(1)

          fullscreen_activity = f'''package {package_name};

          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {{
              @Override
              public void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);
                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_FULLSCREEN,
                      WindowManager.LayoutParams.FLAG_FULLSCREEN
                  );
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  );
              }}
          }}
          '''

          with open(main_activity, "w", encoding="utf-8") as f:
              f.write(fullscreen_activity)

          print("Fullscreen MainActivity created.")
          PY

      # ==========================================
      # SYNC ANDROID
      # ==========================================
      - name: Sync Android
        run: npx cap sync android

      # ==========================================
      # VERSION
      # ==========================================
      - name: Set version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION_CODE=$((RUN_NUMBER + 100))
          VERSION_NAME="1.0.${RUN_NUMBER}"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      # ==========================================
      # LOAD KEYSTORE
      # ==========================================
      - name: Load existing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > FoxEggs.keystore
          mkdir -p android/app
          cp FoxEggs.keystore android/app/FoxEggs.keystore
          echo "Keystore loaded."

      # ==========================================
      # CONFIGURE SIGNING PROPERTIES
      # ==========================================
      - name: Configure signing properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD"
          ALIAS=$(keytool -list -keystore android/app/FoxEggs.keystore -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | grep "PrivateKeyEntry" | head -n 1 | cut -d',' -f1 | xargs)
          cat >> android/gradle.properties <<EOF

          FOXEGGS_KEYSTORE_FILE=FoxEggs.keystore
          FOXEGGS_KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}
          FOXEGGS_KEY_ALIAS=${ALIAS}
          FOXEGGS_KEY_PASSWORD=${KEYSTORE_PASSWORD}
          EOF

      # ==========================================
      # CONFIGURE ANDROID GRADLE (بدون تغییر اسم پکیج)
      # ==========================================
      - name: Configure Android Gradle
        run: |
          python3 - <<'PY'
          import re
          import os

          path = "android/app/build.gradle"
          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          # 🔴 اسم پکیج عمداً تغییر نمیکنه تا اطلاعات کاربران قبلی پاک نشه
          # text = re.sub(r'applicationId\s+"[^"]+"', 'applicationId "com.foxeggs.wallet"', text, count=1)
          
          text = re.sub(r'compileSdk\s+\d+', 'compileSdk 35', text, count=1)
          text = re.sub(r'versionCode\s+\d+', 'versionCode ' + os.environ["VERSION_CODE"], text, count=1)
          text = re.sub(r'versionName\s+"[^"]+"', 'versionName "' + os.environ["VERSION_NAME"] + '"', text, count=1)
          text = re.sub(r'\n\s*signingConfigs\s*\{.*?\n\s*\}\s*(?=\n\s*buildTypes)', '', text, count=1, flags=re.S)

          signing_block = '''
              signingConfigs {
                  release {
                      storeFile file(FOXEGGS_KEYSTORE_FILE)
                      storePassword FOXEGGS_KEYSTORE_PASSWORD
                      keyAlias FOXEGGS_KEY_ALIAS
                      keyPassword FOXEGGS_KEY_PASSWORD
                      v1SigningEnabled true
                      v2SigningEnabled true
                  }
              }

          '''

          if "signingConfigs {" not in text:
              text = text.replace("    buildTypes {", signing_block + "    buildTypes {", 1)

          if "signingConfig signingConfigs.release" not in text:
              text = re.sub(r'(buildTypes\s*\{\s*release\s*\{)', r'\1\n            signingConfig signingConfigs.release', text, count=1, flags=re.S)

          if re.search(r'buildTypes\s*\{.*?release\s*\{', text, re.S):
              release_match = re.search(r'(buildTypes\s*\{\s*release\s*\{)(.*?)(\n\s*\})', text, re.S)
              if release_match:
                  release_body = release_match.group(2)
                  if "minifyEnabled" in release_body:
                      release_body = re.sub(r'minifyEnabled\s+\w+', 'minifyEnabled false', release_body, count=1)
                  else:
                      release_body = "\n            minifyEnabled false" + release_body
                  text = text[:release_match.start(2)] + release_body + text[release_match.end(2):]

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          PY

      # ==========================================
      # CLEAN UNNECESSARY PERMISSIONS
      # ==========================================
      - name: Clean unnecessary permissions
        run: |
          python3 - <<'PY'
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          permissions = ["READ_CONTACTS", "WRITE_CONTACTS", "READ_SMS", "SEND_SMS", "RECEIVE_SMS", "CALL_PHONE", "READ_PHONE_STATE", "ACCESS_FINE_LOCATION", "ACCESS_COARSE_LOCATION", "RECORD_AUDIO", "READ_EXTERNAL_STORAGE", "WRITE_EXTERNAL_STORAGE", "MANAGE_EXTERNAL_STORAGE", "REQUEST_INSTALL_PACKAGES", "SYSTEM_ALERT_WINDOW", "BIND_ACCESSIBILITY_SERVICE"]
          for p in permissions:
              text = re.sub(r'\s*<uses-permission\s+android:name="android\.permission\.' + p + r'"\s*/>', '', text)

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          PY

      # ==========================================
      # ADD PERMISSIONS
      # ==========================================
      - name: Add permissions
        run: |
          python3 - <<'PY'
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          extras = ""
          for perm in ["android.permission.INTERNET", "android.permission.USE_BIOMETRIC", "android.permission.USE_FINGERPRINT", "android.permission.POST_NOTIFICATIONS", "android.permission.VIBRATE", "android.permission.SCHEDULE_EXACT_ALARM", "android.permission.RECEIVE_BOOT_COMPLETED", "android.permission.CAMERA"]:
              if perm not in text:
                  extras += f'    <uses-permission android:name="{perm}" />\n'

          if extras:
              text = text.replace('<application', extras + '    <application', 1)

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          PY

      # ==========================================
      # INSTALL PILLOW
      # ==========================================
      - name: Install Pillow
        run: python3 -m pip install pillow

      # ==========================================
      # FIND ICONS
      # ==========================================
      - name: Find icons
        run: |
          python3 - <<'PY'
          import os
          extensions = (".png", ".jpg", ".jpeg", ".webp")
          icon_file = "icon.png" if os.path.exists("icon.png") else [f for f in os.listdir(".") if os.path.isfile(f) and f.lower().endswith(extensions) and "notification" not in f.lower()][0]
          with open("CUSTOM_ICON", "w") as f: f.write(icon_file)
          notif_file = "notification.png" if os.path.exists("notification.png") else icon_file
          with open("CUSTOM_NOTIFICATION", "w") as f: f.write(notif_file)
          PY

      # ==========================================
      # GENERATE LAUNCHER ICONS
      # ==========================================
      - name: Generate launcher icons
        run: |
          python3 - <<'PY'
          from PIL import Image
          import os
          with open("CUSTOM_ICON", "r") as f: filename = f.read().strip()
          source = Image.open(filename).convert("RGBA")
          for density, size in {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}.items():
              folder = "android/app/src/main/res/mipmap-" + density
              os.makedirs(folder, exist_ok=True)
              icon = source.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(folder + "/ic_launcher.png")
              icon.save(folder + "/ic_launcher_round.png")
              icon.save(folder + "/ic_launcher_foreground.png")
          PY

      # ==========================================
      # GENERATE NOTIFICATION ICONS
      # ==========================================
      - name: Generate notification icons
        run: |
          python3 - <<'PY'
          from PIL import Image
          import os
          with open("CUSTOM_NOTIFICATION", "r") as f: filename = f.read().strip()
          source = Image.open(filename).convert("RGBA")
          def make_mono(img, size):
              img = img.resize((size, size), Image.Resampling.LANCZOS)
              data = img.getdata()
              new_data = [(255, 255, 255, 255) if item[3] > 50 else (0, 0, 0, 0) for item in data]
              img.putdata(new_data)
              return img
          for density, size in {"mdpi": 24, "hdpi": 36, "xhdpi": 48, "xxhdpi": 72, "xxxhdpi": 96}.items():
              folder = "android/app/src/main/res/drawable-" + density
              os.makedirs(folder, exist_ok=True)
              make_mono(source.copy(), size).save(folder + "/ic_notification.png")
          os.makedirs("android/app/src/main/res/drawable", exist_ok=True)
          make_mono(source.copy(), 96).save("android/app/src/main/res/drawable/ic_notification.png")
          PY

      # ==========================================
      # REMOVE ADAPTIVE ICONS
      # ==========================================
      - name: Remove adaptive icon defaults
        run: |
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      # ==========================================
      # BUILD APK
      # ==========================================
      - name: Build Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleRelease --no-daemon

      # ==========================================
      # PREPARE RELEASE
      # ==========================================
      - name: Prepare release
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/FoxEggs-Wallet.apk
          echo "✅ Release prepared."

      # ==========================================
      # UPLOAD
      # ==========================================
      - name: Upload release
        uses: actions/upload-artifact@v6
        with:
          name: FoxEggs-Wallet-v${{ env.VERSION_NAME }}
          path: release/
          if-no-files-found: error

      # ==========================================
      # CLEANUP
      # ==========================================
      - name: Cleanup
        if: always()
        run: |
          rm -f FoxEggs.keystore
          rm -f android/app/FoxEggs.keystore
