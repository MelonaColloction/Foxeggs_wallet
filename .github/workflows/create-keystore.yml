name: Create Keystore

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/create-keystore.yml'

# ═══════════════════════════════════════════════════════
# 🔐 اینجا رمز و اطلاعات رو تغییر بده:
# ═══════════════════════════════════════════════════════
env:
  KEYSTORE_PASSWORD: 'Mani_3840494915_Mani'      # ← رمزت رو بذار
  KEY_ALIAS: 'Mani_3840494915_Mani'                    # ← alias
  TEAM_NAME: 'FoxEggs Team'               # ← اسم تیم
  ORGANIZATION: 'FoxEggs'                 # ← سازمان
# ═══════════════════════════════════════════════════════

jobs:
  create-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 🔐 Create Keystore
        run: |
          keytool -genkeypair -v \
            -keystore FoxEggs.keystore \
            -alias "${{ env.KEY_ALIAS }}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storetype JKS \
            -storepass "${{ env.KEYSTORE_PASSWORD }}" \
            -keypass "${{ env.KEYSTORE_PASSWORD }}" \
            -dname "CN=${{ env.TEAM_NAME }}, OU=Dev, O=${{ env.ORGANIZATION }}, L=City, ST=State, C=IR"

          echo "✅ Keystore created successfully."
          ls -la FoxEggs.keystore

      - name: 🔎 Verify Keystore
        run: |
          echo "=========================================="
          echo "KEYSTORE INFO"
          echo "=========================================="
          keytool -list -v \
            -keystore FoxEggs.keystore \
            -storepass "${{ env.KEYSTORE_PASSWORD }}" | head -n 30

      - name: 🔄 Convert to Base64
        run: |
          base64 -w 0 FoxEggs.keystore > keystore-base64.txt
          echo "Base64 length: $(wc -c < keystore-base64.txt) characters"
          echo "✅ Base64 file created."

      - name: 📝 Create Instructions
        run: |
          cat > INSTRUCTIONS.txt <<EOF
          ╔══════════════════════════════════════════════════════╗
          ║          🦊 FoxEggs Keystore - Instructions          ║
          ╚══════════════════════════════════════════════════════╝

          ✅ فایل‌های موجود در این Artifact:

             📁 FoxEggs.keystore        → فایل اصلی keystore
             📄 keystore-base64.txt     → نسخه Base64 (برای GitHub Secrets)
             📄 INSTRUCTIONS.txt        → همین فایل

          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

          🔐 رمز keystore:
             ${KEYSTORE_PASSWORD}

          ⚠️ اگه یادت نیست، این keystore رو دور بنداز و دوباره بساز!

          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

          📋 مرحله بعد چیه؟

          1️⃣ فایل FoxEggs.keystore رو یه جای امن ذخیره کن
             (بکاپ روی فلش / Google Drive / هارد)

          2️⃣ محتوای فایل keystore-base64.txt رو کپی کن
             (کل متن رو، یه رشته طولانیه)

          3️⃣ برو به GitHub:
             Settings → Secrets and variables → Actions → New repository secret

          4️⃣ دو تا Secret اضافه کن:

             Secret 1:
             Name: KEYSTORE_BASE64
             Value: (محتوای keystore-base64.txt)

             Secret 2:
             Name: KEYSTORE_PASSWORD
             Value: ${KEYSTORE_PASSWORD}

          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

          ⚠️ هشدارها:

          ❌ فایل keystore یا base64 رو توی گیت‌هاب push نکن
          ❌ رمز رو با کسی به اشتراک نذار
          ❌ اگه keystore گم بشه، دیگه نمی‌تونی اپت رو آپدیت کنی

          ✅ حتماً از keystore بکاپ بگیر
          ✅ رمز رو توی یه Password Manager ذخیره کن

          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

          🎯 بعد از اضافه کردن Secrets:

          workflow اصلی (Build FoxEggs Wallet) رو اجرا کن،
          خودش APK امضا شده می‌سازه و توی Artifacts میذاره.

          🦊 FoxEggs Team
          EOF

          echo "✅ Instructions file created."

      - name: 📤 Upload Keystore Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FoxEggs-Keystore
          path: |
            FoxEggs.keystore
            keystore-base64.txt
            INSTRUCTIONS.txt
          retention-days: 7
          if-no-files-found: error

      - name: 🧹 Cleanup
        if: always()
        run: |
          rm -f FoxEggs.keystore keystore-base64.txt
          echo "Cleaned up sensitive files."
