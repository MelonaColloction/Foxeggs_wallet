name: Deploy Site with Obfuscation

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'price.js'
      - 'Fox123.png'
      - 'notification.png'
      - 'image/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Obfuscator
        run: |
          npm install -g javascript-obfuscator
          npm install -g html-minifier-terser

      - name: Obfuscate and Minify
        run: |
          # ۱. فشرده‌سازی HTML
          html-minifier-terser --collapse-whitespace --remove-comments --minify-css true --minify-js false index.html -o index.html.min
          mv index.html.min index.html

          # ۲. مبهم‌سازی JS داخل HTML
          python3 - <<'PY'
          import re, os, subprocess
          with open("index.html", "r", encoding="utf-8") as f: html = f.read()
          scripts = re.findall(r'<script>(.*?)</script>', html, re.DOTALL)
          for i, script in enumerate(scripts):
              if len(script.strip()) < 100: continue
              with open(f"temp_{i}.js", "w", encoding="utf-8") as f: f.write(script)
              subprocess.run([
                  "javascript-obfuscator", f"temp_{i}.js", "--output", f"temp_{i}_obs.js",
                  "--compact", "true", "--control-flow-flattening", "true",
                  "--identifier-names-generator", "hexadecimal", "--string-array", "true", "--self-defending", "true"
              ], capture_output=True)
              if os.path.exists(f"temp_{i}_obs.js"):
                  with open(f"temp_{i}_obs.js", "r", encoding="utf-8") as f: obs = f.read()
                  html = html.replace(script, obs, 1)
              os.remove(f"temp_{i}.js")
              if os.path.exists(f"temp_{i}_obs.js"): os.remove(f"temp_{i}_obs.js")
          with open("index.html", "w", encoding="utf-8") as f: f.write(html)
          PY

          # ۳. مبهم‌سازی price.js
          if [ -f price.js ]; then
            javascript-obfuscator price.js --output price.js --compact true --control-flow-flattening true --identifier-names-generator hexadecimal --string-array true
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
